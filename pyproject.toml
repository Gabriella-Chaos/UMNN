[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umnn"
version = "0.1.0"
description = "Unified Monotonic Neural Networks with Triton optimization"
readme = "README.md"
authors = [
  { name = "Gemini Agent", email = "agent@example.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["deep-learning", "pytorch", "monotonic-networks", "triton", "normalizing-flows"]
dependencies = [
    "torch>=2.0.0",
    "numpy",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
]
gpu = [
    "triton; platform_system=='Linux'",
]

[project.urls]
Homepage = "https://github.com/your-repo/umnn"
Repository = "https://github.com/your-repo/umnn.git"
"Bug Tracker" = "https://github.com/your-repo/umnn/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
